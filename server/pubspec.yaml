name: arena_server
description: Arena game server. Rooms, fair dice, timers, match log and the HTTP API.
version: 0.1.0
publish_to: none

environment:
  sdk: ^3.9.0

dependencies:
  arena_auth:
    path: auth
  arena_wallet:
    path: wallet
  arena_protocol:
    path: ../packages/arena_protocol
  crypto: ^3.0.6
  ludo_bots:
    path: ../packages/ludo_bots
  ludo_engine:
    path: ../packages/ludo_engine
  postgres: ^3.5.17
  redis: ^4.1.0
  shelf: ^1.4.2
  shelf_router: ^1.1.4
  shelf_web_socket: ^3.0.0
  web_socket_channel: ^3.0.3

dev_dependencies:
  http: ^1.6.0
  lints: ^6.1.0
  test: ^1.32.0
