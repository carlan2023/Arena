name: CI

on:
  push:
    branches: [main, "claude/**"]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  # Keep every run on main so deploys always have a finished CI to follow.
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

permissions:
  contents: read

env:
  FLUTTER_VERSION: "3.47.5"
  DART_VERSION: "3.13.4"

jobs:
  detect:
    name: Detect projects
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      dart_packages: ${{ steps.find.outputs.dart_packages }}
      has_dart: ${{ steps.find.outputs.has_dart }}
      has_mobile: ${{ steps.find.outputs.has_mobile }}
    steps:
      - uses: actions/checkout@v4
      - id: find
        run: .github/scripts/find_packages.sh >> "$GITHUB_OUTPUT"

  dart:
    name: Dart ${{ matrix.package }}
    needs: detect
    if: needs.detect.outputs.has_dart == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        package: ${{ fromJson(needs.detect.outputs.dart_packages) }}
    defaults:
      run:
        working-directory: ${{ matrix.package }}
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: arena
          POSTGRES_PASSWORD: arena
          POSTGRES_DB: arena
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U arena"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
      redis:
        image: redis:7
        ports: ["6379:6379"]
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgres://arena:arena@localhost:5432/arena
      REDIS_URL: redis://localhost:6379
      PAYMENTS_PROVIDER: fake
      AUTH_PROVIDER: fake
      # Only the engine has a coverage gate (README section 4, M1.6).
      COVERAGE_MIN: ${{ matrix.package == 'packages/ludo_engine' && '95' || '' }}
    steps:
      - uses: actions/checkout@v4
      - uses: dart-lang/setup-dart@v1
        with:
          sdk: ${{ env.DART_VERSION }}
      - uses: actions/cache@v4
        with:
          path: ~/.pub-cache
          key: pub-dart-${{ runner.os }}-${{ hashFiles('**/pubspec.yaml') }}
          restore-keys: pub-dart-${{ runner.os }}-
      - run: dart pub get
      - run: dart format --output=none --set-exit-if-changed .
      - run: dart analyze --fatal-infos
      - run: dart test --coverage=coverage
      - name: Check coverage
        if: env.COVERAGE_MIN != ''
        run: |
          dart pub global activate coverage
          dart pub global run coverage:format_coverage --lcov --in=coverage --out=coverage/lcov.info --report-on=lib
          "$GITHUB_WORKSPACE/.github/scripts/check_coverage.sh" coverage/lcov.info "$COVERAGE_MIN"
      - uses: actions/upload-artifact@v4
        if: always() && env.COVERAGE_MIN != ''
        with:
          name: coverage-${{ strategy.job-index }}
          path: ${{ matrix.package }}/coverage/lcov.info
          if-no-files-found: ignore

  mobile:
    name: Mobile app
    needs: detect
    if: needs.detect.outputs.has_mobile == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: apps/mobile
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true
      - run: flutter pub get
      - run: dart format --output=none --set-exit-if-changed .
      - run: flutter analyze --fatal-infos
      - run: flutter test --coverage
      - name: Build APK
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: flutter build apk --release --build-number=${{ github.run_number }}
      - uses: actions/upload-artifact@v4
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        with:
          name: arena-apk-${{ github.run_number }}
          path: apps/mobile/build/app/outputs/flutter-apk/app-release.apk
          retention-days: 14

  ci-ok:
    name: CI ok
    needs: [detect, dart, mobile]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check results
        env:
          RESULTS: ${{ join(needs.*.result, ' ') }}
        run: |
          echo "Job results: $RESULTS"
          for r in $RESULTS; do
            case "$r" in
              success|skipped) ;;
              *) echo "::error::A CI job ended with $r"; exit 1 ;;
            esac
          done
